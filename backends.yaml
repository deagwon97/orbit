# Default backend definitions.
#
# orbitd resolves commands via its own PATH (set in config.toml or the systemd
# service Environment=). If a backend command is not on that PATH (e.g. it is
# installed under ~/.nvm or ~/.local/bin), use an absolute path instead:
#
#   command: /home/ubuntu/.nvm/versions/node/v24.16.0/bin/codex
#
backends:
  - id: codex
    name: Codex
    command: codex
    args:
      - --dangerously-bypass-approvals-and-sandbox
  - id: claude
    name: Claude Code
    command: claude
    args:
      - --dangerously-skip-permissions
  - id: opencode
    name: OpenCode
    command: opencode
    args: []
  - id: pi
    name: pi
    command: pi
    args: []
  - id: shell
    name: Shell
    command: /usr/bin/bash
    args:
      - -l
